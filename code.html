<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI围棋APP - 欢迎使用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.3);
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .desc {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .qq-box {
            display: inline-block;
            background: #ffffff;
            color: #1e3c72;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .tip {
            margin-top: 25px;
            font-size: 16px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">欢迎使用 AI围棋App</div>
        <div class="desc">如需获取激活码 / 使用权限</div>
        <div class="desc">请添加下方QQ联系</div>
        
        <div class="qq-box">QQ：309220544</div>
        
        <div class="tip">添加时请备注：围棋App</div>
    </div>
</body>
</html>
